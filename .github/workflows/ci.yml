name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Unit tests exercise the real src/lib modules and the real /api/fixdrop route handlers.
      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
