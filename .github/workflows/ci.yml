name: Next.js Continuous Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js Production Build
        run: npm run build

      - name: Start Next.js server in background
        run: npm run dev &
        env:
          PORT: 3000

      - name: Wait for server to boot (3000)
        run: npx wait-on http://localhost:3000/api/fixdrop?pin=ping --timeout 15000

      - name: Run Automated Unit & E2E Integration Tests
        run: node tests/run-all-tests.mjs
